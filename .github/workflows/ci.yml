name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, verificar formato y estilo, y correr las pruebas
        run: ./mvnw -B verify

      - name: Subir los informes de Surefire si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes-de-surefire
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
