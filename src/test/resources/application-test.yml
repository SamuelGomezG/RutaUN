# Perfil de pruebas: H2 en memoria; migraciones de producción y de humo
# (TT-01 y TT-04).
spring:
  datasource:
    url: jdbc:h2:mem:rutaun;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration,classpath:db/humo
