# Perfil de pruebas: H2 en memoria y migraciones solo de humo (TT-01).
# TT-04 (#51) ajustará las localidades cuando exista V1__esquema.sql.
spring:
  datasource:
    url: jdbc:h2:mem:rutaun;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/humo
