# Configuración común de RutaUN. El perfil dev la completa application-dev.yml.
spring:
  application:
    name: rutaun

  # H2 en archivo: la base persiste entre arranques en el directorio data/.
  # Lo ignoran .gitignore y la CI usa su propio perfil de pruebas.
  datasource:
    url: jdbc:h2:file:./data/rutaun
    username: sa
    password: ""

  # Flyway es el dueño del esquema: Hibernate solo valida.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false


